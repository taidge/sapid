[package]
name = "sapid-web-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

license = "Apache-2.0"

[workspace]

resolver = "3"
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The public site does not expose the four legacy gallery mounting protocols.
# Default builds retain them for the independent 8794 acceptance fixtures.
public-showcase = []
wry-showcase = ["glory/wry"]

[build-dependencies]
miniz_oxide = "=0.8.9"

[dependencies]
miniz_oxide = "=0.8.9"
roxmltree = "=0.21.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sapid = { path = "../..", features = ["accent-matching", "json", "code", "dates", "files", "editor", "phone"] }
glory = { path = "../../../glory/crates/glory", default-features = false, features = ["web", "ssr", "hydrate", "dsl", "routing"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element", "Performance", "Location", "UrlSearchParams", "Storage", "HtmlElement", "CssStyleDeclaration", "Url", "History", "PopStateEvent", "EventTarget", "DragEvent", "DataTransfer", "Selection", "Range", "DomRect", "HtmlVideoElement", "HtmlMediaElement", "NodeList", "HtmlCollection"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# Exercise the sibling Glory source with a single set of public widget types.
[patch.crates-io]
glory = { path = "../../../glory/crates/glory" }

[[bin]]
name = "showcase_wry"
path = "src/bin/showcase_wry.rs"
required-features = ["wry-showcase"]

[[test]]
name = "settings_controls_wry"
path = "tests/settings_controls_wry.rs"
harness = false
required-features = ["wry-showcase"]
