[package]
name = "sapid"
version = "0.9.1"
edition = "2024"
authors = ["Chris Young <chris@veco.id>"]
rust-version = "1.95"
license = "Apache-2.0"
description = "Composable semantic widgets for Glory"
homepage = "https://sapid.taidge.org"
repository = "https://github.com/taidge/sapid"

[features]
default = []
accent-matching = ["dep:unicode-normalization"]
code = []
files = []
phone = ["dep:phonenumber"]
editor = []
json = ["dep:serde_json"]
dates = []

[dependencies]
unicode-normalization = { version = "=0.1.26", optional = true, default-features = false }
phonenumber = { version = "=0.3.10", optional = true }
glory = { version = "0.9.1", default-features = false }
serde_json = { version = "=1.0.154", features = ["raw_value"], optional = true }

[dev-dependencies]
glory = { version = "0.9.1", default-features = false, features = ["ssr", "dsl"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[example]]
name = "schedule_layout_bench"
required-features = ["dates"]

[workspace]
resolver = "3"
